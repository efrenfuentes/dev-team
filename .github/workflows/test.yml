name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install shellcheck, bats, jq
        run: sudo apt-get update -q && sudo apt-get install -yq shellcheck bats jq parallel
      - name: Run checks
        run: test/run.sh
